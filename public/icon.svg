<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bbf7d0" />
      <stop offset="50%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#047857" flood-opacity="0.25" />
    </filter>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Chibi dumbbell icon & sparkles -->
  <g filter="url(#softShadow)" transform="translate(256, 256)">
    <!-- Dumbbell bar -->
    <rect x="-110" y="-14" width="220" height="28" rx="14" fill="#065f46" />
    <!-- Center grip -->
    <rect x="-45" y="-18" width="90" height="36" rx="12" fill="#10b981" stroke="#065f46" stroke-width="4" />
    
    <!-- Left weight -->
    <rect x="-140" y="-80" width="36" height="160" rx="18" fill="#ffffff" stroke="#065f46" stroke-width="8" />
    <rect x="-165" y="-60" width="30" height="120" rx="15" fill="#a7f3d0" stroke="#065f46" stroke-width="8" />
    
    <!-- Right weight -->
    <rect x="104" y="-80" width="36" height="160" rx="18" fill="#ffffff" stroke="#065f46" stroke-width="8" />
    <rect x="135" y="-60" width="30" height="120" rx="15" fill="#a7f3d0" stroke="#065f46" stroke-width="8" />

    <!-- Cute Heart in center -->
    <path d="M 0,-6 C -6,-16 -20,-14 -20,0 C -20,12 0,24 0,24 C 0,24 20,12 20,0 C 20,-14 6,-16 0,-6 Z" fill="#f43f5e" />
  </g>

  <!-- Sparkles -->
  <circle cx="120" cy="110" r="14" fill="#ffffff" opacity="0.9" />
  <circle cx="390" cy="130" r="18" fill="#ffffff" opacity="0.9" />
  <circle cx="380" cy="390" r="12" fill="#ffffff" opacity="0.8" />
  <circle cx="130" cy="380" r="16" fill="#ffffff" opacity="0.8" />
</svg>
